[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rustchain-sdk"
version = "0.1.0"
description = "Python SDK for RustChain Proof-of-Antiquity blockchain"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "EugeneJarvis88", email = "eugenejarvis88@users.noreply.github.com"},
]
keywords = ["rustchain", "blockchain", "proof-of-antiquity", "cryptocurrency", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
rustchain-cli = "rustchain_sdk.cli:main"

[project.urls]
Homepage = "https://github.com/Scottcjn/Rustchain"
Documentation = "https://github.com/EugeneJarvis88/rustchain-sdk"
Repository = "https://github.com/EugeneJarvis88/rustchain-sdk"
Issues = "https://github.com/EugeneJarvis88/rustchain-sdk/issues"

[tool.setuptools.packages.find]
include = ["rustchain_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
